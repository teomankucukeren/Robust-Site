*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050505;color:#fff;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:clamp(24px,6vw,80px);overflow-x:hidden}

.links{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;margin-top:40px}
a{color:#fff;text-decoration:none;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding-bottom:3px}
a.muted{color:#8a8a8a}
a:hover{color:#ff4500}
::selection{background:#ff4500;color:#050505}
</style>
